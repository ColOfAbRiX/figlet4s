name: Build and publish the documentation microsite

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'figlet4s-microsite/**'
      - 'project/**'
      - 'build.sbt'
  pull_request:
    branches:
      - master
    paths:
      - 'figlet4s-microsite/**'
      - 'project/**'
      - 'build.sbt'

jobs:
  publish_microsite:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # Use this or sbt-dynver won't see the tag
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build the microsite
        run: sbt figlet4sMicrosite/paradox

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SITE=figlet4s-microsite/target/paradox-site
          git switch --orphan gh-pages
          cp -r "$SITE"/* .
          touch .nojekyll
          git add -A
          git commit -m "Update microsite from ${GITHUB_SHA}"
          git push origin gh-pages --force
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

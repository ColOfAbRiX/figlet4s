name: "Mark stale issues and pull requests"
on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 60
          days-before-close: 30
          exempt-issue-labels: "feature,task"
          stale-issue-label: "wontfix"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. Thank you
            for your contributions.
          close-issue-message: "This issue was automatically closed because it has been stale for 30 days with no activity."
          stale-pr-label: "wontfix"
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. Thank you
            for your contributions.
          close-pr-message: "This pull request was automatically closed because it has been stale for 30 days with no activity."
